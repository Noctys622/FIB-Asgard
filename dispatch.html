<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIB Asgard RP · Dispatch</title><link rel="icon" type="image/jpeg" href="assets/fib-logo.svg"><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="shell nav"><a class="brand" href="index.html"><div class="logo"><img src="assets/fib-logo.svg" alt="Logo FIB"></div><span>FIB Asgard RP · Dispatch</span></a><nav class="navlinks"><a href="index.html">Accueil</a><a class="active" href="dispatch.html">Dispatch</a><a href="dossiers.html">Dossiers</a><a href="agent.html">Agents</a></nav><div class="actions"><button class="btn success" id="serviceBtn">● En service</button><button class="btn primary" id="newCall">+ Nouvel appel</button></div></div></header>
<main class="section"><div class="shell"><div class="section-head"><div><div class="kicker">Centre opérationnel</div><h2>Dispatch</h2><div class="muted">Gestion des appels, unités et interventions.</div></div><div class="tabs"><button class="tab active">En direct</button><button class="tab">Unités</button><button class="tab">Historique</button></div></div>
<div class="dispatch-layout"><section class="panel"><div class="panel-head"><strong>Appels en direct</strong><span class="tag red" id="callCount">0 appel</span></div><div class="panel-body" id="calls"></div></section>
<section class="panel"><div class="panel-head"><strong>Carte en direct</strong><span class="tag green">● Connectée</span></div><div class="panel-body"><div class="map" id="map"><div class="marker call" style="left:33%;top:44%"></div><div class="marker" style="left:58%;top:29%"></div><div class="marker" style="left:68%;top:63%"></div></div><div class="card" style="margin-top:12px"><strong id="selectedTitle">Sélectionnez un appel</strong><p id="selectedText">Les détails de l'intervention apparaîtront ici.</p><div class="tabs"><button class="tab" id="assignA01">Assigner A-01</button><button class="tab" id="closeCall">Clôturer</button></div></div></div></section>
<section class="panel"><div class="panel-head"><strong>Unités actives</strong><span class="tag green">6 unités</span></div><div id="units"></div></section></div></div></main>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;place-items:center;padding:20px"><div class="card" style="width:min(520px,100%)"><h3>Nouvel appel</h3><div class="form"><div class="field"><label>Code</label><select id="code"><option>10-90</option><option>10-70</option><option>10-80</option><option>10-11</option></select></div><div class="field"><label>Titre</label><input id="title" placeholder="Braquage, poursuite, suspicion..."></div><div class="field"><label>Localisation</label><input id="location" placeholder="Vinewood Blvd"></div><div class="field"><label>Priorité</label><select id="priority"><option value="high">Haute</option><option value="medium">Moyenne</option><option value="normal">Normale</option></select></div><div class="field"><label>Détails</label><textarea id="details"></textarea></div><div class="grid two"><button class="btn" id="cancelCall">Annuler</button><button class="btn primary" id="saveCall">Créer l'appel</button></div></div></div></div>
<script src="app.js"></script></body></html>
