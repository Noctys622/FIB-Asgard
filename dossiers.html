<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIB Asgard RP · Dossiers</title><link rel="icon" type="image/jpeg" href="assets/fib-logo.svg"><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="shell nav"><a class="brand" href="index.html"><div class="logo"><img src="assets/fib-logo.svg" alt="Logo FIB"></div><span>FIB Asgard RP</span></a><nav class="navlinks"><a href="index.html">Accueil</a><a class="active" href="dossiers.html">Dossiers</a><a href="dispatch.html">Dispatch</a><a href="agent.html">Agents</a></nav><div class="actions"><button class="btn primary" id="newCase">+ Nouveau dossier</button></div></div></header>
<main class="section"><div class="shell"><div class="section-head"><div><div class="kicker">Investigations</div><h2>Dossiers</h2><div class="muted">Registre interne des affaires et opérations.</div></div></div>
<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Nom</th><th>Type</th><th>Responsable</th><th>Statut</th><th>Confidentialité</th></tr></thead><tbody id="caseRows"></tbody></table></div></div></main>
<div id="caseModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;place-items:center;padding:20px"><div class="card" style="width:min(520px,100%)"><h3>Nouveau dossier</h3><div class="form"><div class="field"><label>Nom</label><input id="caseName"></div><div class="field"><label>Type</label><select id="caseType"><option>Crime organisé</option><option>Corruption</option><option>Cybercriminalité</option><option>Terrorisme</option></select></div><div class="field"><label>Responsable</label><input id="caseLead" placeholder="Agent A-01"></div><div class="field"><label>Confidentialité</label><select id="caseClearance"><option>Interne</option><option>Sensible</option><option>Classifié</option></select></div><div class="grid two"><button class="btn" id="cancelCase">Annuler</button><button class="btn primary" id="saveCase">Créer</button></div></div></div></div>
<script src="app.js"></script></body></html>
